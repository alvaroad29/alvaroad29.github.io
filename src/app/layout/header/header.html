<header class="sticky top-0 z-50 border-b border-border bg-background/80 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
    <a routerLink="/" fragment="home" (click)="closeMenu()"
        class="text-lg font-bold tracking-tight">{{ site.name }}</a>

    <!-- Una sola lista: dropdown en mobile, fila en desktop -->
    <nav
      id="main-nav"
      [attr.aria-label]="t().a11y.mainNav"
      [class.hidden]="!menuOpen()"
      class="absolute inset-x-0 top-full border-b border-border bg-background px-6 py-4
              md:static md:block md:border-0 md:bg-transparent md:p-0"
    >
      <ul class="flex flex-col gap-4 md:flex-row md:items-center md:gap-8">
        @for (section of sections; track section) {
          <li>
            <a routerLink="/" [fragment]="section" (click)="closeMenu()"
                class="text-muted transition-colors hover:text-foreground">
              {{ t().nav[section] }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      <app-language-toggle />
      <app-theme-toggle />
      <button
        appButton
        variant="icon"
        type="button"
        class="md:hidden"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? t().a11y.closeMenu : t().a11y.openMenu"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        } @else {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
